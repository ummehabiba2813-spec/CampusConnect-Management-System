{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto; padding: 20px; border-radius: 10px; background: #fff; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">

    <h2 style="text-align: center; margin-bottom: 20px;">✏️ Edit Course</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div style="text-align: center; margin-top: 20px;">
            <button type="submit" style="background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">
                ✅ Update Course
            </button>
            <a href="{% url 'manage_courses' %}" style="margin-left: 15px; background: #ccc; color: black; padding: 10px 20px; border-radius: 6px; text-decoration: none;">
                ⬅ Cancel
            </a>
        </div>
    </form>

</div>
{% endblock %}
