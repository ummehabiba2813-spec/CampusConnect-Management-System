{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-body text-center">
            <h2 class="text-danger mb-4">⚠️ Confirm Delete</h2>
            <p class="fs-5">
                Are you sure you want to delete this course:
                <strong class="text-primary">{{ course.title }}</strong>?
            </p>

            <form method="POST" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg me-2">
                    Yes, Delete
                </button>
            </form>

            <a href="{% url 'manage_courses' %}" class="btn btn-secondary btn-lg">
                Cancel
            </a>
        </div>
    </div>
</div>
{% endblock %}
