<h3>Grade Submission: {{ submission.assignment.title }}</h3>
<p>Student: {{ submission.student.get_full_name }}</p>

<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label>Marks (Total: {{ submission.assignment.total_marks }})</label>
        <input type="number" name="grade" class="form-control" value="{{ submission.grade|default:'' }}" required>
    </div>
    
    <div class="mb-3">
        <label>Teacher Feedback</label>
        <textarea name="feedback" class="form-control">{{ submission.feedback }}</textarea>
    </div>
    
    <button type="submit" class="btn btn-success">Save Grade</button>
</form>
