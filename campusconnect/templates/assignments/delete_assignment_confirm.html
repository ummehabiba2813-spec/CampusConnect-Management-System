{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow p-4" style="max-width: 600px; margin:auto; border-radius:15px;">
        <h3 class="text-danger">🗑️ Delete Assignment</h3>
        <p>Are you sure you want to delete the assignment: <strong>{{ assignment.title }}</strong>?</p>

        <form method="post" action="{% url 'delete_assignment' assignment.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'manage_assignments' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
