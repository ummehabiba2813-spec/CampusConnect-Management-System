{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-success shadow-lg">
                <div class="card-header bg-success text-white text-center">
                    <h4>Delete Announcement</h4>
                </div>
                <div class="card-body text-center text-dark">
                    <p>Are you sure you want to delete:</p>
                    <h5><b>{{ announcement.title }}</b></h5>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-50 mt-3">Yes, Delete</button>
                    </form>
                    <a href="{% url 'announcements:manage_announcements' %}" class="btn btn-secondary mt-2">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
