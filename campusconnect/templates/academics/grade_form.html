{% extends "base.html" %}
{% block title %}Grade{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="mb-3">Grade — {{ submission.student.username }} ({{ submission.assignment.title }})</h5>
      <form method="post">{% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Grade (0–100)</label>
          <input type="number" step="0.01" min="0" max="100" name="grade" class="form-control" value="{{ submission.grade }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Feedback</label>
          <textarea name="feedback" class="form-control" rows="4">{{ submission.feedback }}</textarea>
        </div>
        <button class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
