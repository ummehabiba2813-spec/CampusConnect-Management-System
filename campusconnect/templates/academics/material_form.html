{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Upload Material{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="mb-3">Upload Material — {{ course.code }}</h5>
      <form method="post" enctype="multipart/form-data">{% csrf_token %} {{ form|crispy }}
        <button class="btn btn-success">Upload</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
