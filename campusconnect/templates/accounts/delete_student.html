{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg p-4 text-center">
        <h3 class="text-danger mb-4">Confirm Delete</h3>

        <p>Are you sure you want to delete this student?</p>
        <h5 class="fw-bold">{{ student.name }}</h5>
        <p>Roll No: {{ student.roll_no }}</p>

        <form method="POST" class="mt-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger w-100 mb-2">Yes, Delete</button>
        </form>

        <a href="{% url 'student_list' %}" class="btn btn-secondary w-100">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
