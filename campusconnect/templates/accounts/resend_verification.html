{% extends "base.html" %}
{% block title %}Resend Verification{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Resend Email Verification</h4>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" name="email" required>
          </div>
          <button class="btn btn-success w-100">Send</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
