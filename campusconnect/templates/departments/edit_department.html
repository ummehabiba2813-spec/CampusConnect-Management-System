{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h3>✏ Edit Department</h3>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Department Code</label>
            <input type="text" name="code" value="{{ department.code }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Department Name</label>
            <input type="text" name="name" value="{{ department.name }}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'manage_departments' %}" class="btn btn-secondary">⬅ Back</a>
    </form>
</div>
{% endblock %}
