{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Departments</h2>
  <a href="{% url 'add_department' %}" class="btn btn-success mb-3">+ Add Department</a>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for dept in departments %}
      <tr>
        <td>{{ dept.code }}</td>
        <td>{{ dept.name }}</td>
        <td>
          <a href="{% url 'edit_department' dept.pk %}" class="btn btn-sm btn-primary">Edit</a>
          <a href="{% url 'delete_department' dept.pk %}" class="btn btn-sm btn-danger">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="3">No departments yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
