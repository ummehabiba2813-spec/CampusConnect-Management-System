{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h3>❌ Delete Department</h3>
    <p>Are you sure you want to delete <strong>{{ department.name }}</strong> ({{ department.code }})?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'manage_departments' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
